<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autorisieren · Samuel Studios</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0e1016;color:#c7cbdb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:380px;background:#171b27;border:1px solid rgba(120,132,168,.28);border-radius:18px;padding:34px 26px;text-align:center}
.logo{width:64px;height:64px;border-radius:16px;object-fit:contain;background:#22283a;padding:6px;margin:0 auto 16px;display:block}
h1{font-size:21px;color:#f5f6fb;margin-bottom:8px}
p{font-size:13.5px;line-height:1.6;color:#8b91ab;margin-bottom:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:700;color:#fff;background:#5865F2;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.state{display:none}
.state.on{display:block}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.12);border-top-color:#5865F2;border-radius:50%;margin:0 auto 16px;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.ok{color:#3ddc84}
.err{color:#ff5c68}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="Logo.png" alt="" onerror="this.style.display='none'">

  <div class="state on" id="sStart">
    <h1>Account autorisieren</h1>
    <p> mit <b>/deauthorize</b> widerrufst du deine authorisierung.</p>
    <a class="btn" id="authBtn" href="#">Jetzt autorisieren</a>
  </div>

  <div class="state" id="sLoad">
    <div class="spin"></div>
    <h1>Wird verifiziert…</h1>
  </div>

  <div class="state" id="sDone">
    <h1 id="doneTitle"></h1>
    <p id="doneText"></p>
  </div>
</div>

<script>
const API_BASE = "https://botconfig.wisp.uno";
const CLIENT_ID = "1446188210794401883";
const REDIRECT_URI = location.origin + location.pathname;

function show(id) {
  document.querySelectorAll(".state").forEach(function (e) { e.classList.toggle("on", e.id === id); });
}

function done(ok, title, text) {
  var t = document.getElementById("doneTitle");
  t.textContent = title;
  t.className = ok ? "ok" : "err";
  document.getElementById("doneText").textContent = text;
  var p = document.getElementById("doneText");
  p.style.marginBottom = "0";
  show("sDone");
}

document.getElementById("authBtn").href = "https://discord.com/oauth2/authorize?" + new URLSearchParams({
  client_id: CLIENT_ID,
  redirect_uri: REDIRECT_URI,
  response_type: "code",
  scope: "identify guilds.join",
  state: "join"
}).toString();

(function () {
  var params = new URLSearchParams(location.search);
  var code = params.get("code");
  if (params.get("error")) {
    history.replaceState({}, "", REDIRECT_URI);
    done(false, "Abgebrochen", "Die Autorisierung wurde bei Discord abgebrochen.");
    return;
  }
  if (!code) return;
  history.replaceState({}, "", REDIRECT_URI);
  show("sLoad");
  fetch(API_BASE + "/api/authorize", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: code, redirect_uri: REDIRECT_URI })
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok && d.ok, d: d }; });
  }).then(function (res) {
    done(res.ok, res.d.title || (res.ok ? "Verifiziert ✅" : "Fehlgeschlagen"), res.d.text || (res.ok ? "Du kannst dieses Fenster schließen." : "Bitte versuch es erneut."));
  }).catch(function () {
    done(false, "Fehlgeschlagen", "Der Server ist gerade nicht erreichbar.");
  });
})();
</script>
</body>
</html>
