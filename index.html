<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FGRP // Command Deck</title>
<style>
:root{
  --void:#06070c;
  --hull:#0d1018;
  --panel:#11141d;
  --panel2:#161a26;
  --line:#1f2433;
  --line-bright:#2c3247;
  --text:#dfe3ee;
  --muted:#6b7286;
  --muted2:#8f96ab;
  --signal:#ff5a3c;
  --signal-dim:#a83f2b;
  --ok:#3ecf8e;
  --warn:#ffb547;
  --crit:#ff4d6a;
  --info:#4ea1ff;
  --mono:'JetBrains Mono','Consolas',monospace;
  --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--void);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:64px 64px;
  background-position:-1px -1px;
}
::selection{background:var(--signal);color:#0a0a0a;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--hull);}
::-webkit-scrollbar-thumb{background:var(--line-bright);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--signal-dim);}
a{color:inherit;}
button{font-family:inherit;}
input,select,textarea{font-family:var(--sans);}

.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 26px;
  background:rgba(9,11,17,0.86);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,var(--signal),#7a2a1c);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:15px;color:#0a0a0a;
  box-shadow:0 0 22px rgba(255,90,60,.35);
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text b{font-size:15px;letter-spacing:.02em;}
.brand-text span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;}
.topbar-right{display:flex;align-items:center;gap:16px;}
.status-pill{
  display:flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:11px;color:var(--muted2);
  border:1px solid var(--line);border-radius:20px;padding:6px 12px;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite;}
.dot.off{background:var(--crit);box-shadow:0 0 8px var(--crit);animation:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.user-chip{display:flex;align-items:center;gap:10px;cursor:pointer;padding:5px 10px 5px 5px;border-radius:20px;border:1px solid var(--line);}
.user-chip:hover{border-color:var(--line-bright);}
.user-chip img{width:26px;height:26px;border-radius:50%;}
.user-chip span{font-size:13px;font-weight:600;}
.master-tag{font-family:var(--mono);font-size:9px;background:var(--signal);color:#0a0a0a;padding:2px 6px;border-radius:4px;font-weight:700;letter-spacing:.05em;}

.shell{display:flex;min-height:calc(100vh - 63px);}
.sidebar{
  width:230px;flex-shrink:0;
  border-right:1px solid var(--line);
  background:rgba(11,13,20,.5);
  padding:18px 12px;
  position:sticky;top:63px;height:calc(100vh - 63px);overflow-y:auto;
}
.server-select{margin-bottom:18px;position:relative;}
.server-select label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;padding:0 8px;display:block;margin-bottom:6px;}
.server-btn{
  width:100%;display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:9px 10px;cursor:pointer;color:var(--text);text-align:left;
}
.server-btn img{width:26px;height:26px;border-radius:6px;background:var(--panel2);}
.server-btn .sname{font-size:13px;font-weight:600;}
.server-btn .smembers{font-size:10px;color:var(--muted);font-family:var(--mono);}
.server-btn:hover{border-color:var(--signal-dim);}
.server-dropdown{
  position:absolute;left:12px;right:12px;margin-top:6px;
  background:var(--panel2);border:1px solid var(--line-bright);border-radius:10px;
  max-height:280px;overflow-y:auto;z-index:40;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.server-dropdown .server-item{display:flex;align-items:center;gap:10px;padding:10px;cursor:pointer;border-bottom:1px solid var(--line);}
.server-dropdown .server-item:last-child{border-bottom:none;}
.server-dropdown .server-item:hover{background:var(--panel);}
.server-dropdown img{width:24px;height:24px;border-radius:6px;}

nav.navlist{display:flex;flex-direction:column;gap:2px;}
.navlist .navlabel{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;padding:14px 10px 6px;}
.navlist button{
  display:flex;align-items:center;gap:10px;
  background:transparent;border:none;color:var(--muted2);
  padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;text-align:left;width:100%;
  border-left:2px solid transparent;
}
.navlist button:hover{background:var(--panel);color:var(--text);}
.navlist button.active{background:var(--panel2);color:var(--text);border-left:2px solid var(--signal);}
.navlist button .ic{width:16px;text-align:center;font-size:14px;opacity:.85;}
.navlist button .count{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--panel);padding:1px 6px;border-radius:8px;color:var(--muted);}

.main{flex:1;min-width:0;padding:28px 34px 80px;}
.main-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.main-head h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em;}
.main-head .sub{color:var(--muted);font-size:13px;font-family:var(--mono);}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;}

.btn{
  background:var(--panel2);border:1px solid var(--line-bright);color:var(--text);
  padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:transform .08s;
}
.btn:hover{border-color:var(--signal);}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--signal),#c94429);border:none;color:#0a0a0a;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-danger{background:transparent;border:1px solid var(--crit);color:var(--crit);}
.btn-danger:hover{background:rgba(255,77,106,.1);}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted2);}
.btn-ghost:hover{border-color:var(--line-bright);color:var(--text);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.icon-btn{background:var(--panel2);border:1px solid var(--line);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted2);}
.icon-btn:hover{color:var(--text);border-color:var(--line-bright);}

.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:700px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--signal-dim),transparent);
  opacity:0;transition:opacity .2s;
}
.card:hover::before{opacity:1;}
.card h3{margin:0 0 14px;font-size:13px;color:var(--muted2);font-weight:600;letter-spacing:.03em;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}

.stat-card{display:flex;flex-direction:column;gap:6px;}
.stat-card .num{font-family:var(--mono);font-size:32px;font-weight:700;}
.stat-card .lbl{font-size:12px;color:var(--muted);}
.stat-card.accent .num{color:var(--signal);}
.stat-card.ok .num{color:var(--ok);}
.stat-card.warn .num{color:var(--warn);}

.section{margin-bottom:30px;}
.section-title{font-size:12px;font-family:var(--mono);color:var(--muted);letter-spacing:.1em;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--line);}

.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.list-row:last-child{border-bottom:none;}
.list-row:hover{background:var(--panel2);}
.list-row .avatar{width:34px;height:34px;border-radius:8px;background:var(--panel2);object-fit:cover;flex-shrink:0;}
.list-row .primary{font-size:13.5px;font-weight:600;}
.list-row .secondary{font-size:11.5px;color:var(--muted);font-family:var(--mono);}
.list-row .grow{flex:1;min-width:160px;}
.list-row .tags{display:flex;gap:5px;flex-wrap:wrap;}

.badge{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:6px;letter-spacing:.03em;border:1px solid transparent;white-space:nowrap;}
.badge.legal{background:rgba(78,161,255,.12);color:var(--info);border-color:rgba(78,161,255,.3);}
.badge.illegal{background:rgba(255,77,106,.12);color:var(--crit);border-color:rgba(255,77,106,.3);}
.badge.ok{background:rgba(62,207,142,.12);color:var(--ok);border-color:rgba(62,207,142,.3);}
.badge.warn{background:rgba(255,181,71,.12);color:var(--warn);border-color:rgba(255,181,71,.3);}
.badge.crit{background:rgba(255,77,106,.12);color:var(--crit);border-color:rgba(255,77,106,.3);}
.badge.neutral{background:var(--panel2);color:var(--muted2);border-color:var(--line);}
.badge.role{background:var(--panel2);color:var(--text);border-color:var(--line-bright);cursor:pointer;}
.badge.role.assigned{background:rgba(255,90,60,.14);color:var(--signal);border-color:var(--signal-dim);}
.badge.action{background:var(--panel2);color:var(--info);border-color:var(--line-bright);}

.empty{padding:50px 20px;text-align:center;color:var(--muted);}
.empty .ic{font-size:34px;margin-bottom:10px;opacity:.6;}
.empty .t{font-size:14px;font-weight:600;color:var(--muted2);margin-bottom:4px;}
.empty .d{font-size:12.5px;}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:8px 12px;flex:1;min-width:180px;max-width:320px;
}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;}
.search-box .ic{color:var(--muted);font-size:13px;}
.select-box{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--text);font-size:13px;outline:none;}
.select-box option{background:var(--panel2);}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--muted2);margin-bottom:6px;font-weight:600;}
.field input,.field textarea,.field select{
  width:100%;background:var(--hull);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;color:var(--text);font-size:13.5px;outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--signal-dim);}
.field textarea{resize:vertical;min-height:70px;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}
.hint{font-size:11px;color:var(--muted);margin-top:4px;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(4,5,9,.72);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;
}
.modal{
  background:var(--panel);border:1px solid var(--line-bright);border-radius:16px;
  width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}
.modal.wide{max-width:640px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2;}
.modal-head h3{margin:0;font-size:15px;}
.modal-body{padding:22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel);}
.close-x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;width:28px;height:28px;border-radius:6px;}
.close-x:hover{background:var(--panel2);color:var(--text);}

.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
.toast{
  background:var(--panel2);border:1px solid var(--line-bright);border-left:3px solid var(--signal);
  padding:12px 16px;border-radius:9px;font-size:13px;max-width:320px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:toastin .25s ease;
}
.toast.ok{border-left-color:var(--ok);}
.toast.err{border-left-color:var(--crit);}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.loader-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:16px;}
.spinner{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--signal);animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-screen .t{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.login-wrap::before{
  content:'';position:absolute;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,90,60,.14),transparent 70%);
  top:-200px;left:50%;transform:translateX(-50%);filter:blur(30px);
}
.login-card{position:relative;z-index:2;text-align:center;padding:50px 44px;background:var(--panel);border:1px solid var(--line);border-radius:20px;max-width:400px;}
.login-mark{width:64px;height:64px;border-radius:16px;margin:0 auto 22px;background:linear-gradient(135deg,var(--signal),#7a2a1c);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:26px;font-weight:700;color:#0a0a0a;box-shadow:0 0 40px rgba(255,90,60,.4);}
.login-card h1{font-size:20px;margin:0 0 8px;}
.login-card p{color:var(--muted);font-size:13.5px;margin:0 0 26px;line-height:1.6;}
.login-error{background:rgba(255,77,106,.1);border:1px solid rgba(255,77,106,.35);color:var(--crit);padding:10px 14px;border-radius:9px;font-size:12.5px;margin-bottom:20px;}

.toggle{position:relative;width:42px;height:23px;background:var(--hull);border-radius:24px;cursor:pointer;border:1px solid var(--line);flex-shrink:0;transition:background .15s;}
.toggle.on{background:var(--ok);border-color:var(--ok);}
.toggle-dot{position:absolute;top:2px;left:2px;width:17px;height:17px;background:white;border-radius:50%;transition:.15s;}
.toggle.on .toggle-dot{left:21px;}

.progress-log{background:var(--hull);border:1px solid var(--line);border-radius:9px;padding:12px;font-family:var(--mono);font-size:11.5px;color:var(--muted2);max-height:160px;overflow-y:auto;}

.tabs{display:flex;gap:4px;background:var(--hull);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:18px;width:fit-content;flex-wrap:wrap;}
.tabs button{background:transparent;border:none;color:var(--muted);padding:8px 16px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;}
.tabs button.active{background:var(--panel2);color:var(--text);}

.log-entry{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;flex-wrap:wrap;}
.log-entry:last-child{border-bottom:none;}
.log-entry .ts{font-family:var(--mono);color:var(--muted);font-size:11px;white-space:nowrap;}
.log-entry .act{color:var(--signal);font-weight:600;font-family:var(--mono);font-size:11px;}
.log-entry .det{color:var(--muted2);flex:1;min-width:160px;}
.log-entry .who{color:var(--info);font-size:11px;font-family:var(--mono);}

.perm-editor{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--hull);border:1px solid var(--line);border-radius:9px;max-height:180px;overflow-y:auto;}

.timeline{position:relative;padding-left:18px;}
.timeline::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line);}
.timeline-item{position:relative;padding-bottom:16px;}
.timeline-item::before{content:'';position:absolute;left:-16px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--signal);}
.timeline-item:last-child{padding-bottom:0;}

.crumbs{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px;}
.crumbs b{color:var(--signal);}

.kv{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted2);}
.kv div b{color:var(--text);}
</style>
</head>
<body>

<div id="toastWrap" class="toast-wrap"></div>
<div id="app"></div>

<script>
const API_BASE = "https://botconfig.wisp.uno";

let state = {
  token: localStorage.getItem("session_token") || null,
  me: null,
  view: "overview",
  guilds: [],
  activeGuild: null,
  serverDropdownOpen: false,
  settings: {},
  fraktionen: [],
  members: [],
  roles: [],
  channels: [],
  memberSearch: "",
  memberRoleFilter: "",
  teamStrafen: [],
  buergerStrafen: [],
  bewerbungen: [],
  bewerbungFilter: "offen",
  backups: [],
  whitelist: [],
  accessLog: [],
  actionLog: [],
  actionLogFilter: "",
  modules: { status: {}, labels: {} },
  activeModuleTab: "fraktion",
  messageHistory: [],
  channelMessageHistory: [],
  loading: true,
  connError: false,
  modal: null,
};

// ---------------- utils ----------------

function toast(msg, kind = "") {
  const wrap = document.getElementById("toastWrap");
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtDate(iso) {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("de-DE") + " " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  } catch { return iso; }
}

async function apiFetch(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: {
      ...(options.headers || {}),
      "Authorization": `Bearer ${state.token}`,
      "Content-Type": "application/json",
    },
  });
  if (res.status === 401 || res.status === 403) {
    localStorage.removeItem("session_token");
    state.token = null;
    state.me = null;
    render();
    throw new Error("Nicht autorisiert");
  }
  if (!res.ok) {
    let detail = "Fehler";
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  try { return await res.json(); } catch { return {}; }
}

function login() { window.location.href = `${API_BASE}/auth/login`; }
function logout() {
  apiFetch("/auth/logout", { method: "POST" }).catch(() => {});
  localStorage.removeItem("session_token");
  state = { ...state, token: null, me: null };
  render();
}

function getTokenFromUrl() {
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const queryParams = new URLSearchParams(window.location.search);
  const token = hashParams.get("token") || queryParams.get("token");
  const error = hashParams.get("error") || queryParams.get("error");
  if (token) {
    localStorage.setItem("session_token", token);
    state.token = token;
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  if (error === "forbidden") {
    state.loginError = "Keine Berechtigung. Dieser Account steht nicht auf der Whitelist.";
  }
}

function setView(v) { state.view = v; render(); loadViewData(); }

function openModal(name, payload = {}) {
  state.modal = { name, ...payload };
  render();
}
function closeModal() { state.modal = null; render(); }

// ---------------- data loading ----------------

async function loadInitial() {
  state.loading = true; render();
  try {
    state.me = await apiFetch("/auth/me");
    state.guilds = await apiFetch("/api/guilds");
    if (state.guilds.length) state.activeGuild = state.guilds[0];
    state.modules = await apiFetch("/api/modules");
    state.connError = false;
  } catch (e) {
    if (e.message !== "Nicht autorisiert") state.connError = true;
  }
  state.loading = false;
  render();
  if (!state.connError && state.me) loadViewData();
}

async function loadViewData() {
  try {
    if (state.view === "overview") {
      state.summary = await apiFetch("/api/dashboard_summary");
    } else if (state.view === "members") {
      if (state.activeGuild) {
        state.members = await apiFetch(`/api/guilds/${state.activeGuild.guild_id}/members`);
        state.roles = await apiFetch(`/api/guilds/${state.activeGuild.guild_id}/roles`);
      }
    } else if (state.view === "fraktionen") {
      state.fraktionen = await apiFetch("/api/fraktionen");
    } else if (state.view === "team_strafen") {
      state.teamStrafen = await apiFetch("/api/team_strafen");
    } else if (state.view === "buerger_strafen") {
      state.buergerStrafen = await apiFetch("/api/buerger_strafen");
    } else if (state.view === "bewerbungen") {
      state.bewerbungen = await apiFetch("/api/bewerbungen");
    } else if (state.view === "backups") {
      if (state.activeGuild) state.backups = await apiFetch(`/api/backups/${state.activeGuild.guild_id}`);
    } else if (state.view === "settings") {
      state.settings = await apiFetch("/api/settings");
      if (state.activeGuild) state.channels = await apiFetch(`/api/guilds/${state.activeGuild.guild_id}/channels`);
    } else if (state.view === "modules") {
      state.modules = await apiFetch("/api/modules");
      if (state.activeGuild) state.roles = await apiFetch(`/api/guilds/${state.activeGuild.guild_id}/roles`);
      await loadModulePerms(state.activeModuleTab);
    } else if (state.view === "whitelist") {
      state.whitelist = await apiFetch("/api/whitelist");
      state.accessLog = await apiFetch("/api/access_log");
    } else if (state.view === "actionlog") {
      state.actionLog = await apiFetch("/api/action_log");
    } else if (state.view === "messages") {
      state.messageHistory = await apiFetch("/api/messages/history");
      if (state.activeGuild) state.channels = await apiFetch(`/api/guilds/${state.activeGuild.guild_id}/channels`);
      try { state.channelMessageHistory = await apiFetch("/api/channel_messages/history"); } catch { state.channelMessageHistory = []; }
    }
  } catch (e) {
    if (e.message !== "Nicht autorisiert") toast(e.message, "err");
  }
  render();
}

async function loadModulePerms(mod) {
  try {
    state.modulePerms = state.modulePerms || {};
    state.modulePerms[mod] = await apiFetch(`/api/modules/${mod}/permissions`);
  } catch (e) {}
}

async function requestResync() {
  if (!state.activeGuild) return;
  try {
    await apiFetch(`/api/guilds/${state.activeGuild.guild_id}/resync`, { method: "POST" });
    toast("Sync angefordert — Bot verarbeitet das in wenigen Sekunden.", "ok");
  } catch (e) { toast(e.message, "err"); }
}

// ---------------- render dispatcher ----------------

function render() {
  const app = document.getElementById("app");

  if (!state.token || !state.me) {
    app.innerHTML = renderLogin();
    return;
  }
  if (state.loading) {
    app.innerHTML = `<div class="loader-screen"><div class="spinner"></div><div class="t">VERBINDE MIT COMMAND DECK…</div></div>`;
    return;
  }
  if (state.connError) {
    app.innerHTML = `
      <div class="loader-screen">
        <div style="font-size:40px">⚠️</div>
        <div class="t" style="color:var(--crit)">VERBINDUNG ZUR API FEHLGESCHLAGEN</div>
        <div style="color:var(--muted);font-size:12.5px;max-width:420px;text-align:center;line-height:1.6">

        </div>
        <button class="btn btn-primary" onclick="loadInitial()">Erneut versuchen</button>
      </div>`;

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">FG</div>
        <div class="brand-text"><b>Command Deck</b><span>FGRP CONTROL SYSTEM</span></div>
      </div>

        </div>
      </div>
    </div>
    <div class="shell">

function renderLogin() {

function toggleServerDropdown() {
  state.serverDropdownOpen = !state.serverDropdownOpen;

}
function selectGuild(id) {
  state.activeGuild = state.guilds.find(g => g.guild_id === id) || state.activeGuild;
  state.serverDropdownOpen = false;
  render();
  loadViewData();
}

function renderView() {
  switch (state.view) {
    case "overview": return renderOverview();
    case "members": return renderMembers();
    case "backups": return renderBackups();
    case "settings": return renderSettings();
    case "fraktionen": return renderFraktionen();
    case "team_strafen": return renderStrafen("team");
    case "buerger_strafen": return renderStrafen("buerger");
    case "bewerbungen": return renderBewerbungen();
    case "messages": return renderMessages();

    default: return "";
  }
}

// ---------------- MEMBERS ----------------

function renderMembers() {
  if (!state.activeGuild) return emptyNoGuild();
  const filtered = state.members.filter(m => {
    const q = state.memberSearch.toLowerCase();
    const matchesSearch = !q || (m.username || "").toLowerCase().includes(q) || (m.display_name || "").toLowerCase().includes(q);
    const matchesRole = !state.memberRoleFilter || m.role_ids.includes(Number(state.memberRoleFilter));
    return matchesSearch && matchesRole;
  });
  return `
    <div class="main-head">
      <div><h1>Mitglieder</h1><div class="sub">${state.members.length} GESAMT · ${filtered.length} ANGEZEIGT</div></div>
      <div class="head-actions"><button class="btn btn-ghost" onclick="requestResync()">↻ Resync</button></div>
    </div>
    <div class="toolbar">
      <div class="search-box"><span class="ic">⌕</span><input placeholder="Suche nach Name…" value="${esc(state.memberSearch)}" oninput="state.memberSearch=this.value;render()"></div>
      <select class="select-box" onchange="state.memberRoleFilter=this.value;render()">
        <option value="">Alle Rollen</option>
        ${state.roles.map(r => `<option value="${r.role_id}" ${state.memberRoleFilter == r.role_id ? "selected" : ""}>${esc(r.name)} (${r.member_count})</option>`).join("")}
      </select>
    </div>
    <div class="list">
      ${filtered.length ? filtered.slice(0, 200).map(m => `
        <div class="list-row">
          <img class="avatar" src="${esc(m.avatar_url || '')}" onerror="this.style.visibility='hidden'">
          <div class="grow">
            <div class="primary">${esc(m.display_name)} ${statusDot(m.status)}</div>
            <div class="secondary">@${esc(m.username)} · ${m.user_id}</div>
          </div>
          <div class="tags" style="max-width:340px">
            ${m.role_ids.slice(0, 6).map(rid => {
              const r = state.roles.find(x => x.role_id === rid);
              return r ? `<span class="badge role assigned" title="Klicke zum Entfernen" onclick="toggleRole(${m.user_id}, ${rid}, 'remove')">${esc(r.name)}</span>` : "";
            }).join("")}
          </div>
          <button class="icon-btn" title="Rolle hinzufügen" onclick="openModal('assignRole', {userId:${m.user_id}, name:'${esc(m.display_name)}'})">+</button>
        </div>
      `).join("") : `<div class="empty"><div class="ic">◈</div><div class="t">Keine Mitglieder gefunden</div><div class="d">Passe die Suche an oder starte einen Resync.</div></div>`}
    </div>
  `;
}

function statusDot(status) {
  const map = { online: "🟢", idle: "🌙", dnd: "⛔" };
  return `<span style="font-size:10px">${map[status] || "⚫"}</span>`;
}

async function toggleRole(userId, roleId, action) {
  if (!state.activeGuild) return;
  try {
    await apiFetch(`/api/guilds/${state.activeGuild.guild_id}/members/${userId}/roles/${roleId}`, {
      method: "POST", body: JSON.stringify({ action }),
    });
    toast(action === "add" ? "Rolle wird zugewiesen…" : "Rolle wird entfernt…", "ok");
    const m = state.members.find(x => x.user_id === userId);
    if (m) {
      if (action === "add" && !m.role_ids.includes(roleId)) m.role_ids.push(roleId);
      if (action === "remove") m.role_ids = m.role_ids.filter(r => r !== roleId);
    }
    render();
  } catch (e) { toast(e.message, "err"); }
}

async function toggleModule(mod) {
  try {
    const newVal = !state.modules.status[mod];
    await apiFetch(`/api/modules/${mod}`, { method: "POST", body: JSON.stringify({ enabled: newVal }) });
    state.modules.status[mod] = newVal;
    toast(`Modul ${newVal ? "aktiviert" : "deaktiviert"}.`, "ok");
    render();
  } catch (e) { toast(e.message, "err"); }
}
function switchModuleTab(mod) {
  state.activeModuleTab = mod;
  render();
  loadModulePerms(mod).then(render);
}
async function togglePermRole(mod, roleId) {
  const perms = state.modulePerms[mod] || { roles: [], users: [] };
  const roles = perms.roles.includes(roleId) ? perms.roles.filter(r => r !== roleId) : [...perms.roles, roleId];
  try {
    await apiFetch(`/api/modules/${mod}/permissions`, { method: "POST", body: JSON.stringify({ roles, users: perms.users }) });
    state.modulePerms[mod].roles = roles;
    toast("Berechtigung aktualisiert.", "ok");
    render();
  } catch (e) { toast(e.message, "err"); }
}

    const b = m.b;
    const fragen = ["Dein Alter","Was ist Frp","Was ist RDM","Was ist VDM","Was ist Meta Gaming","Was ist PowerRp","Was hast du als Admin zu Beachten","Was darfst du als Admin Nicht","Hast du schon Erfahrung als Admin Wenn ja wo?","Dein roblox username","Wann hättest du zeit für ein bewerbungsgespräch"];
    html = `
      <div class="modal-head"><h3>Bewerbung #${b.id}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        ${b.antworten.map((a, i) => `<div class="field"><label>${esc(fragen[i] || ("Frage " + (i+1)))}</label><div style="font-size:13px;color:var(--muted2)">${esc(a)}</div></div>`).join("")}
      </div>`;
  } else if (m.name === "sendMessage") {
    html = `
      <div class="modal-head"><h3>Direktnachricht senden</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>User ID</label><input id="msg_uid"></div>
        <div class="field"><label>Nachricht</label><textarea id="msg_text"></textarea></div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
        <button class="btn btn-primary" onclick="sendMessage(document.getElementById('msg_uid').value, document.getElementById('msg_text').value)">Senden</button></div>`;
  } else if (m.name === "sendChannelMessage") {
    html = `
      <div class="modal-head"><h3>Als Bot in Kanal senden</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        ${!state.activeGuild ? `<div class="hint">Kein Server ausgewählt.</div>` : `
        <div class="field">
          <label>Kanal</label>
          <select id="cm_channel">
            ${state.channels.filter(c => c.type === "text" || c.type === "TextChannel" || c.type.includes("text")).map(c => `<option value="${c.channel_id}">#${esc(c.name)}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>Nachricht</label><textarea id="cm_text" placeholder="Der Bot postet diese Nachricht direkt im gewählten Kanal."></textarea></div>
        <div class="hint">Erfordert das Backend-Update (channel_messages Tabelle + Worker-Loop in bot2.py).</div>
        `}
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
        ${state.activeGuild ? `<button class="btn btn-primary" onclick="sendChannelMessage(document.getElementById('cm_channel').value, document.getElementById('cm_text').value)">Senden</button>` : ""}
      </div>`;
  } else if (m.name === "addWhitelist") {
    html = `
      <div class="modal-head"><h3>Nutzer zur Whitelist hinzufügen</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>User ID</label><input id="wl_uid"></div>
        <div class="field"><label>Username (optional)</label><input id="wl_uname"></div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
        <button class="btn btn-primary" onclick="addWhitelist(document.getElementById('wl_uid').value, document.getElementById('wl_uname').value)">Hinzufügen</button></div>`;
  } else if (m.name === "backupView") {
    html = `
      <div class="modal-head"><h3>${esc(m.filename)}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div style="font-size:12.5px;color:var(--muted2);margin-bottom:10px">
          Rollen: <b>${m.data.roles?.length || 0}</b> · Kategorien: <b>${m.data.categories?.length || 0}</b> · Erstellt: ${fmtDate(m.data.created_at)}
        </div>
        <div class="progress-log" style="max-height:320px">${esc(JSON.stringify(m.data, null, 2)).slice(0, 4000)}</div>
      </div>`;
  }

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalOverlay";
  overlay.onclick = (e) => { if (e.target.id === "modalOverlay") closeModal(); };
  const box = document.createElement("div");
  box.className = "modal" + (m.name === "backupView" ? " wide" : "");
  box.innerHTML = html;
  overlay.appendChild(box);
  document.getElementById("app").appendChild(overlay);

  if (m.name === "newStrafe") {
    const actionSel = document.getElementById("s_action");
    const typWrap = document.getElementById("s_typwrap");
    actionSel.addEventListener("change", () => {
      typWrap.style.display = actionSel.value === "ban" ? "block" : "none";
    });
    document.getElementById("s_cancel").addEventListener("click", closeModal);
    document.getElementById("s_submit").addEventListener("click", () => {
      const action = actionSel.value;
      const payload = {
        grund: document.getElementById("s_grund").value,
        roblox_username: document.getElementById("s_rbx").value || null,
        discord_username: document.getElementById("s_dc").value || null,
      };
      if (action === "ban") payload.typ = document.getElementById("s_typ").value;
      submitStrafeAction(m.kind, document.getElementById("s_uid").value, action, payload);
    });
  }
}

// ---------------- boot ----------------

getTokenFromUrl();
if (state.token) {
  loadInitial();
} else {
  render();
}
</script>
</body>
</html>
