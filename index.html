<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Control</title>
<style>
:root{
  --bg:#0a0a10;
  --panel:#12121b;
  --panel2:#161622;
  --text:#f2f2f7;
  --muted:#9a9aad;
  --line:rgba(255,255,255,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;}
body{display:flex;flex-direction:column;align-items:center;padding:32px 16px 80px;}

@keyframes rainbow-spin{
  0%{background-position:0% 50%;}
  100%{background-position:300% 50%;}
}
.rainbow-border{
  position:relative;
  border-radius:18px;
  padding:2px;
  background:linear-gradient(90deg,#ff2d55,#ff9500,#ffe600,#2dff6b,#2dd6ff,#7a4dff,#ff2dd6,#ff2d55);
  background-size:300% 100%;
  animation:rainbow-spin 6s linear infinite;
}
.rainbow-border-inner{
  border-radius:16px;
  background:var(--panel);
  height:100%;
  width:100%;
}
.rainbow-text{
  background:linear-gradient(90deg,#ff2d55,#ff9500,#ffe600,#2dff6b,#2dd6ff,#7a4dff,#ff2dd6,#ff2d55);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:rainbow-spin 6s linear infinite;
}

.shell{width:100%;max-width:720px;display:flex;flex-direction:column;gap:20px;}

.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px;}
.brand h1{font-size:26px;font-weight:800;margin:0;letter-spacing:0.3px;}

.card{padding:24px;}
.card-title{font-size:15px;font-weight:700;margin:0 0 16px;color:var(--muted);}

.login-box{text-align:center;padding:48px 24px;}
.login-box p{color:var(--muted);margin:0 0 24px;line-height:1.5;}

.btn{
  border:none;
  border-radius:12px;
  padding:13px 22px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  color:#fff;
  transition:transform .15s ease, filter .15s ease;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(90deg,#ff2d55,#7a4dff);}
.btn-ghost{background:var(--panel2);border:1px solid var(--line);}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px;font-size:13px;}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.user-chip{display:flex;align-items:center;gap:10px;}
.user-chip img{width:36px;height:36px;border-radius:50%;}
.user-chip span{font-size:14px;font-weight:600;}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12px;color:var(--muted);font-weight:600;}
select,input[type=text],textarea{
  background:var(--panel2);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:10px;
  padding:11px 13px;
  font-size:14px;
  font-family:inherit;
  outline:none;
}
select:focus,input[type=text]:focus,textarea:focus{border-color:#7a4dff;}
textarea{resize:vertical;min-height:90px;}

.tabs{display:flex;gap:8px;flex-wrap:wrap;}
.tab{
  background:var(--panel2);
  border:1px solid var(--line);
  color:var(--muted);
  padding:9px 16px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.tab.active{color:#0a0a10;border-color:transparent;background:linear-gradient(90deg,#ff9500,#2dd6ff);}

.tabpane{display:none;}
.tabpane.active{display:block;}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row span{font-size:14px;}

.switch{position:relative;width:46px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:#2c2c3a;border-radius:999px;transition:.2s;}
.slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .slider{background:linear-gradient(90deg,#2dff6b,#2dd6ff);}
.switch input:checked + .slider:before{transform:translateX(20px);}
.switch input:disabled + .slider{opacity:.4;cursor:not-allowed;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);}
th{color:var(--muted);font-weight:600;}

.msg{font-size:13px;padding:10px 12px;border-radius:10px;margin-top:12px;display:none;}
.msg.ok{display:block;background:rgba(45,255,107,0.12);color:#7dffa9;}
.msg.err{display:block;background:rgba(255,45,85,0.12);color:#ff8a9c;}

.hidden{display:none !important;}
.muted{color:var(--muted);font-size:13px;}
.rank-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);}
</style>
</head>
<body>

<div class="shell">
  <div class="brand">
    <h1 class="rainbow-text">SERVER CONTROL</h1>
  </div>

  <div id="loginView" class="rainbow-border">
    <div class="rainbow-border-inner card login-box">
      <p>Melde dich mit Discord an, um deine Server zu verwalten.</p>
      <button class="btn btn-primary" id="loginBtn">Mit Discord anmelden</button>
    </div>
  </div>

  <div id="appView" class="hidden" style="display:flex;flex-direction:column;gap:20px;">

    <div class="rainbow-border">
      <div class="rainbow-border-inner card topbar">
        <div class="user-chip">
          <img id="userAvatar" src="" alt="">
          <span id="userName"></span>
        </div>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Abmelden</button>
      </div>
    </div>

    <div class="rainbow-border">
      <div class="rainbow-border-inner card">
        <p class="card-title">Server</p>
        <div class="field">
          <select id="guildSelect"></select>
        </div>
        <span id="guildRankBadge" class="rank-badge"></span>
      </div>
    </div>

    <div id="guildArea" class="hidden" style="display:flex;flex-direction:column;gap:20px;">

      <div class="tabs">
        <div class="tab active" data-tab="module">Module</div>
        <div class="tab" data-tab="rollen">Rollen &amp; Kanäle</div>
        <div class="tab" data-tab="admins">Admins</div>
        <div class="tab" data-tab="say">Say</div>
        <div class="tab" data-tab="dm">DM</div>
      </div>

      <div class="rainbow-border">
        <div class="rainbow-border-inner card">

          <div class="tabpane active" id="pane-module">
            <p class="card-title">Feature-Module</p>
            <div id="moduleList"></div>
            <div class="msg" id="moduleMsg"></div>
          </div>

          <div class="tabpane" id="pane-rollen">
            <p class="card-title">Rolle setzen</p>
            <div class="field">
              <label>Rollen-Schlüssel</label>
              <select id="roleKeySelect">
                <option value="auto_role">auto_role</option>
                <option value="fraktion_role">fraktion_role</option>
              </select>
            </div>
            <div class="field">
              <label>Rolle</label>
              <select id="roleValueSelect"></select>
            </div>
            <button class="btn btn-primary btn-block" id="saveRoleBtn">Rolle speichern</button>

            <p class="card-title" style="margin-top:24px;">Kanal setzen</p>
            <div class="field">
              <label>Kanal-Schlüssel</label>
              <select id="channelKeySelect">
                <option value="rp_auto_channel">rp_auto_channel</option>
              </select>
            </div>
            <div class="field">
              <label>Kanal</label>
              <select id="channelValueSelect"></select>
            </div>
            <button class="btn btn-primary btn-block" id="saveChannelBtn">Kanal speichern</button>
            <div class="msg" id="rollenMsg"></div>
          </div>

          <div class="tabpane" id="pane-admins">
            <p class="card-title">Vergebene Ränge</p>
            <table id="adminsTable">
              <thead><tr><th>User-ID</th><th>Name</th><th>Rang</th></tr></thead>
              <tbody id="adminsBody"></tbody>
            </table>

            <p class="card-title" style="margin-top:24px;">Rang setzen</p>
            <div class="field">
              <label>User-ID</label>
              <input type="text" id="adminUserId" placeholder="123456789012345678">
            </div>
            <div class="field">
              <label>Rang (0-100)</label>
              <input type="text" id="adminRankValue" placeholder="100">
            </div>
            <button class="btn btn-primary btn-block" id="saveAdminBtn">Rang speichern</button>
            <div class="msg" id="adminsMsg"></div>
          </div>

          <div class="tabpane" id="pane-say">
            <p class="card-title">Nachricht in Kanal senden</p>
            <div class="field">
              <label>Kanal</label>
              <select id="sayChannelSelect"></select>
            </div>
            <div class="field">
              <label>Nachricht</label>
              <textarea id="sayMessage"></textarea>
            </div>
            <button class="btn btn-primary btn-block" id="sayBtn">Senden</button>
            <div class="msg" id="sayMsg"></div>
          </div>

          <div class="tabpane" id="pane-dm">
            <p class="card-title">Direktnachricht senden</p>
            <div class="field">
              <label>User-ID</label>
              <input type="text" id="dmUserId" placeholder="123456789012345678">
            </div>
            <div class="field">
              <label>Nachricht</label>
              <textarea id="dmMessage"></textarea>
            </div>
            <button class="btn btn-primary btn-block" id="dmBtn">Senden</button>
            <div class="msg" id="dmMsg"></div>
          </div>

        </div>
      </div>

    </div>

  </div>
</div>

<script>
const API_BASE = "   https://botconfig.wisp.uno/api/health";
const DISCORD_CLIENT_ID = "1446188210794401883";
const REDIRECT_URI = window.location.origin + window.location.pathname;

let sessionToken = localStorage.getItem("session_token") || null;
let currentUser = null;
let guilds = [];
let currentGuildId = null;
let currentRank = 0;
let currentConfig = null;
let featureLabels = {};

function showMsg(id, text, ok){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "err");
  el.style.display = "block";
  setTimeout(()=>{ el.style.display = "none"; }, 4000);
}

async function api(path, options={}){
  const headers = options.headers || {};
  if(sessionToken) headers["Authorization"] = "Bearer " + sessionToken;
  if(options.body) headers["Content-Type"] = "application/json";
  const res = await fetch(API_BASE + path, { ...options, headers });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ("Fehler " + res.status));
  return data;
}

function buildDiscordAuthUrl(){
  const params = new URLSearchParams({
    client_id: DISCORD_CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: "code",
    scope: "identify"
  });
  return "https://discord.com/oauth2/authorize?" + params.toString();
}

document.getElementById("loginBtn").addEventListener("click", ()=>{
  window.location.href = buildDiscordAuthUrl();
});

document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  try{ await api("/api/auth/logout", { method:"POST" }); }catch(e){}
  localStorage.removeItem("session_token");
  sessionToken = null;
  window.location.href = REDIRECT_URI;
});

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll(".tabpane").forEach(p=>p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("pane-" + tab.dataset.tab).classList.add("active");
  });
});

async function exchangeCode(code){
  const data = await api("/api/auth/discord", {
    method:"POST",
    body: JSON.stringify({ code, redirect_uri: REDIRECT_URI })
  });
  sessionToken = data.session_token;
  localStorage.setItem("session_token", sessionToken);
  history.replaceState({}, "", REDIRECT_URI);
}

async function loadUser(){
  currentUser = await api("/api/auth/me");
  document.getElementById("userName").textContent = currentUser.username;
  document.getElementById("userAvatar").src = currentUser.avatar_url || "https://cdn.discordapp.com/embed/avatars/0.png";
}

async function loadGuilds(){
  guilds = await api("/api/guilds");
  const sel = document.getElementById("guildSelect");
  sel.innerHTML = "";
  guilds.forEach(g=>{
    const opt = document.createElement("option");
    opt.value = g.guild_id;
    opt.textContent = g.name;
    sel.appendChild(opt);
  });
  if(guilds.length){
    currentGuildId = guilds[0].guild_id;
    await loadGuildArea();
  }
}

async function loadFeatureLabels(){
  const data = await api("/api/modules");
  featureLabels = data.labels || {};
}

function renderModules(){
  const list = document.getElementById("moduleList");
  list.innerHTML = "";
  const features = currentConfig.config.features;
  Object.keys(features).forEach(key=>{
    const row = document.createElement("div");
    row.className = "toggle-row";
    const label = document.createElement("span");
    label.textContent = featureLabels[key] || key;
    const switchWrap = document.createElement("label");
    switchWrap.className = "switch";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = !!features[key];
    input.disabled = currentRank < 100;
    input.addEventListener("change", async ()=>{
      try{
        await api("/api/guild/" + currentGuildId + "/config", {
          method:"POST",
          body: JSON.stringify({ features: { [key]: input.checked } })
        });
        showMsg("moduleMsg", "Gespeichert.", true);
      }catch(e){
        input.checked = !input.checked;
        showMsg("moduleMsg", e.message, false);
      }
    });
    const slider = document.createElement("span");
    slider.className = "slider";
    switchWrap.appendChild(input);
    switchWrap.appendChild(slider);
    row.appendChild(label);
    row.appendChild(switchWrap);
    list.appendChild(row);
  });
}

function fillSelect(selectEl, items, valueKey, labelKey){
  selectEl.innerHTML = "";
  items.forEach(item=>{
    const opt = document.createElement("option");
    opt.value = item[valueKey];
    opt.textContent = item[labelKey];
    selectEl.appendChild(opt);
  });
}

async function loadGuildArea(){
  const guild = guilds.find(g=>g.guild_id === currentGuildId);
  currentRank = guild ? guild.rank : 0;
  document.getElementById("guildRankBadge").textContent = "Rang " + currentRank;

  currentConfig = await api("/api/guild/" + currentGuildId + "/config");
  document.getElementById("guildArea").classList.remove("hidden");

  renderModules();

  fillSelect(document.getElementById("roleValueSelect"), currentConfig.available_roles, "role_id", "name");
  fillSelect(document.getElementById("channelValueSelect"), currentConfig.available_channels, "channel_id", "name");
  fillSelect(document.getElementById("sayChannelSelect"), currentConfig.available_channels, "channel_id", "name");

  const editable = currentRank >= 100;
  document.getElementById("saveRoleBtn").disabled = !editable;
  document.getElementById("saveChannelBtn").disabled = !editable;
  document.getElementById("saveAdminBtn").disabled = !editable;

  if(editable){
    await loadAdmins();
  }
}

async function loadAdmins(){
  const admins = await api("/api/guild/" + currentGuildId + "/admins");
  const body = document.getElementById("adminsBody");
  body.innerHTML = "";
  admins.forEach(a=>{
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>" + a.user_id + "</td><td>" + (a.username || "-") + "</td><td>" + a.rank + "</td>";
    body.appendChild(tr);
  });
}

document.getElementById("guildSelect").addEventListener("change", async (e)=>{
  currentGuildId = e.target.value;
  await loadGuildArea();
});

document.getElementById("saveRoleBtn").addEventListener("click", async ()=>{
  try{
    const key = document.getElementById("roleKeySelect").value;
    const val = document.getElementById("roleValueSelect").value;
    await api("/api/guild/" + currentGuildId + "/config", {
      method:"POST",
      body: JSON.stringify({ roles: { [key]: parseInt(val) } })
    });
    showMsg("rollenMsg", "Rolle gespeichert.", true);
  }catch(e){
    showMsg("rollenMsg", e.message, false);
  }
});

document.getElementById("saveChannelBtn").addEventListener("click", async ()=>{
  try{
    const key = document.getElementById("channelKeySelect").value;
    const val = document.getElementById("channelValueSelect").value;
    await api("/api/guild/" + currentGuildId + "/config", {
      method:"POST",
      body: JSON.stringify({ channels: { [key]: parseInt(val) } })
    });
    showMsg("rollenMsg", "Kanal gespeichert.", true);
  }catch(e){
    showMsg("rollenMsg", e.message, false);
  }
});

document.getElementById("saveAdminBtn").addEventListener("click", async ()=>{
  try{
    const userId = document.getElementById("adminUserId").value.trim();
    const rank = document.getElementById("adminRankValue").value.trim();
    await api("/api/guild/" + currentGuildId + "/admins", {
      method:"POST",
      body: JSON.stringify({ user_id: userId, rank: parseInt(rank) })
    });
    showMsg("adminsMsg", "Rang gespeichert.", true);
    await loadAdmins();
  }catch(e){
    showMsg("adminsMsg", e.message, false);
  }
});

document.getElementById("sayBtn").addEventListener("click", async ()=>{
  try{
    const channelId = document.getElementById("sayChannelSelect").value;
    const message = document.getElementById("sayMessage").value;
    await api("/api/guild/" + currentGuildId + "/say", {
      method:"POST",
      body: JSON.stringify({ channel_id: channelId, message })
    });
    showMsg("sayMsg", "Nachricht gesendet.", true);
    document.getElementById("sayMessage").value = "";
  }catch(e){
    showMsg("sayMsg", e.message, false);
  }
});

document.getElementById("dmBtn").addEventListener("click", async ()=>{
  try{
    const targetId = document.getElementById("dmUserId").value.trim();
    const message = document.getElementById("dmMessage").value;
    await api("/api/guild/" + currentGuildId + "/dm", {
      method:"POST",
      body: JSON.stringify({ target_user_id: targetId, message })
    });
    showMsg("dmMsg", "Nachricht gesendet.", true);
    document.getElementById("dmMessage").value = "";
  }catch(e){
    showMsg("dmMsg", e.message, false);
  }
});

async function init(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if(code){
    try{ await exchangeCode(code); }catch(e){ alert(e.message); }
  }
  if(!sessionToken){
    document.getElementById("loginView").classList.remove("hidden");
    document.getElementById("appView").classList.add("hidden");
    return;
  }
  try{
    await loadUser();
    await loadFeatureLabels();
    await loadGuilds();
    document.getElementById("loginView").classList.add("hidden");
    document.getElementById("appView").classList.remove("hidden");
  }catch(e){
    localStorage.removeItem("session_token");
    sessionToken = null;
    document.getElementById("loginView").classList.remove("hidden");
    document.getElementById("appView").classList.add("hidden");
  }
}

init();
</script>
</body>
</html>
